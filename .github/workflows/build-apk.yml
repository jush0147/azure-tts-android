name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - work
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "false"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
        with:
          gradle-version: 8.7

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install required Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Build debug APK (capture full log)
        id: build_debug
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --info --warning-mode all --no-daemon 2>&1 | tee gradle-build-debug.log

      - name: Upload debug APK artifact (if built)
        if: always()
        uses: actions/upload-artifact@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Build release APK (non-blocking)
        id: build_release
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace --info --warning-mode all --no-daemon 2>&1 | tee gradle-build-release.log

      - name: Upload release APK artifact (if built)
        if: always()
        uses: actions/upload-artifact@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
        with:
          name: app-release-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: ignore

      - name: Upload Gradle logs
        if: always()
        uses: actions/upload-artifact@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
        with:
          name: gradle-build-logs
          path: |
            gradle-build-debug.log
            gradle-build-release.log
          if-no-files-found: warn

      - name: Fail workflow if debug build failed
        if: steps.build_debug.outcome != 'success'
        run: |
          echo "Debug APK build failed. See artifact 'gradle-build-logs' for full diagnostics."
          exit 1

      - name: Release build summary
        if: always()
        run: |
          if [ "${{ steps.build_release.outcome }}" = "success" ]; then
            echo "Release APK build succeeded."
          else
            echo "Release APK build failed (non-blocking). Debug APK remains the required signal."
          fi
